services:
  - type: web
    name: track-finder
    runtime: node
    plan: free
    region: oregon
    rootDir: web-app
    buildCommand: npm install && node install.js
    startCommand: node server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: APK_DOWNLOAD_URL
        sync: false
      - key: LAVALINK_URL
        sync: false
      - key: LAVALINK_AUTH
        sync: false
