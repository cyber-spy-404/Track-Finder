services:
  - type: web
    name: track-finder
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm install && node install.js
    startCommand: node server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: APK_DOWNLOAD_URL
        sync: false
      - key: LAVALINK_URL
        value: "http://lavalink.jirayu.net:13592"
      - key: LAVALINK_AUTH
        value: "youshallnotpass"
      - key: MONGODB_URI
        sync: false
